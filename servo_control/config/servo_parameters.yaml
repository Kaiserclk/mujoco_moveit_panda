servo_control:
  thread_priority: {
    type: int,
    read_only: true,
    default_value: 40,
    description: "This value is used when configuring the servo loop thread to use SCHED_FIFO scheduling \
                  We use a slightly lower priority than the ros2_control default in order to reduce jitter \
                  Reference: https://man7.org/linux/man-pages/man2/sched_setparam.2.html",
    validation: {
      gt_eq<>: 0
    }
  }

  publish_period: {
    type: double,
    read_only: true,
    default_value: 0.01,
    description: " 1 / (Nominal publish rate) [seconds]",
    validation: {
      gt<>: 0.0
    }
  }

  max_expected_latency: {
    type: double,
    read_only: true,
    default_value: 0.1,
    description: "Maximum expected latency between generating a servo \
                  command and the controller receiving it [seconds].",
    validation: {
      gt<>: 0.0
    }
  }

  move_group_name: {
    type: string,
    read_only: true,
    description: "The name of the moveit move_group of your robot \
                  This parameter does not have a default value and \
                  must be passed to the node during launch time."
  }


################################ GENERAL CONFIG ################################

  joint_names: {
    type: string_array,
    read_only: true,
    default_value: ["panda_joint1", "panda_joint2", "panda_joint3", "panda_joint4", "panda_joint5", "panda_joint6", "panda_joint7"],
    description: "List of joint names for the servo control"
  }


############################# INCOMING COMMAND SETTINGS ########################
  pose_command_in_topic: {
    type: string,
    read_only: true,
    default_value: "~/pose_target_cmds",
    description: "The topic on which servo will receive the pose commands"
  }

  cartesian_command_in_topic: {
    type: string,
    read_only: true,
    default_value: "~/delta_twist_cmds",
    description: "The topic on which servo will receive the twist commands"
  }

  joint_command_in_topic: {
    type: string,
    read_only: true,
    default_value: "~/delta_joint_cmds",
    description: "The topic on which servo will receive the joint jog commands"
  }

  command_in_type: {
    type: string,
    default_value: "unitless",
    description: "指令的单位说明：无单位指令的取值范围为 [-1, 1]，逻辑等效于操纵杆输出；速度单位分别为米 / 秒和弧度 / 秒。",
    validation: {
      one_of<>: [["unitless", "speed_units"]]
    }
  }


  scale:
    linear: {
      type: double,
      default_value: 0.4,
      description: "若采用速度单位或进行位姿跟踪，该值为最大线速度（单位：米 / 秒）；否则作为无量纲指令速度的缩放系数。适用于笛卡尔空间运动及位姿跟踪指令。"
    }
    rotational: {
      type: double,
      default_value: 0.8,
      description: "若使用速度单位或进行位姿跟踪，该值为最大角速度（单位：弧度 / 秒）；否则作为无量纲指令速度的缩放系数。适用于笛卡尔空间运动及位姿跟踪指令。"
    }
    joint: {
      type: double,
      default_value: 0.5,
      description: "关节角速度 / 线速度缩放系数。仅适用于无量纲关节指令。"
    }

  incoming_command_timeout: {
    type: double,
    default_value: 0.1,
    description: "指令超时时间（单位：秒），超时指令将被丢弃。该参数至关重要，因为 ROS 系统可能会丢失部分消息"
  }

############################### JOINT LIMITING #################################
  halt_all_joints_in_joint_mode: {
    type: bool,
    default_value: true,
    description: "Halt all joints in joint mode, else halt only the joints at their limit"
  }

  halt_all_joints_in_cartesian_mode: {
    type: bool,
    default_value: true,
    description: "Halt all joints in cartesian mode, else halt only the joints at their limit"
  }

  joint_limit_margins: {
    type: double_array,
    default_value: [0.1],
    description: "该数值作为关节位置边界的缓冲余量（单位与对应关节变量一致）。可设为单值（对所有关节统一生效），也可设置为与当前启用关节组的自由度数量相同的数组。若运动速度较快，建议调大该数值。",
    validation: {
      lower_element_bounds<>: 0.0
    }
  }

  override_velocity_scaling_factor: {
    type: double,
    default_value: 0.0,
    description: "Scaling factor when servo overrides the velocity (e.g, near singularities)",
    validation: {
      bounds<>: [0.0, 1.0]
    }
  }

  ############################ POSE TRACKING SETTINGS #############################

  pose_tracking:
    linear_tolerance: {
        type: double,
        default_value: 0.001,
        description: "The allowable linear error, in meters, when tracking a pose.",
        validation: {
          gt<>: 0.0
        }
    }

    angular_tolerance: {
        type: double,
        default_value: 0.01,
        description: "The allowable angular error, in radians, when tracking a pose.",
        validation: {
          gt<>: 0.0
        }
    }


################################ TWIST SETTINGS #################################

  apply_twist_commands_about_ee_frame: {
    type: bool,
    default_value: true,
    description: "若勾选为真，则位速度指令中设定的角速度将以末端执行器坐标系的坐标轴为基准进行作用；\
                  若勾选为假，由于末端执行器坐标系与规划坐标系之间存在力臂偏移，求解得到的位速度会附带因末端执行器坐标系绕规划坐标系旋转所产生的线速度分量"
  }


  ############################## OUTGOING COMMAND SETTINGS #######################

  status_topic: {
    type: string,
    read_only: true,
    default_value: "~/status",
    description: "The topic to which the status will be published"
  }

  command_out_topic: {
    type: string,
    read_only: true,
    default_value: "/panda_arm_controller/joint_trajectory",
    description: "The topic on which servo will publish the joint trajectory. Change this to the topic your controller requires."
  }

  command_out_type: {
    type: string,
    read_only: true,
    default_value: "trajectory_msgs/JointTrajectory",
    description: "The type of command that servo will publish",
    validation: {
      one_of<>: [["trajectory_msgs/JointTrajectory", "std_msgs/Float64MultiArray"]]
    }
  }

  publish_joint_positions: {
    type: bool,
    default_value: true,
    description: "If true servo will publish joint positions in the output command"
  }

  publish_joint_velocities: {
    type: bool,
    default_value: true,
    description: "If true servo will publish joint velocities in the output command"
  }

  publish_joint_accelerations: {
    type: bool,
    default_value: false,
    description: "If true servo will publish joint accelerations in the output command"
  }

  ############################## PLANNING SCENE MONITOR ##########################

  monitored_planning_scene_topic: {
    type: string,
    read_only: true,
    default_value: "/planning_scene",
    description: "The name of the planning scene topic."
  }

  joint_topic: {
    type: string,
    read_only: true,
    default_value: "/joint_states",
    description: "The topic on which joint states can be monitored"
  }

  check_octomap_collisions: {
    type: bool,
    read_only: true,
    default_value: false,
    description: "If true, the planning scene monitor also listens to octomap updates for collision checking."
  }

  is_primary_planning_scene_monitor: {
    type: bool,
    read_only: true,
    default_value: true,
    description: "If true, the Servo server's PlanningScene advertises the /get_planning_scene service."
  }

  ############################### SMOOTHING PLUGIN ###############################

  use_smoothing: {
    type: bool,
    read_only: true,
    default_value: true,
    description: "Enables the use of smoothing plugins for joint trajectory smoothing"
  }

  smoothing_filter_plugin_name: {
    type: string,
    read_only: true,
    default_value: "online_signal_smoothing::ButterworthFilterPlugin",
    description: "The name of the smoothing plugin to be used"
  }

  ############################# SINGULARITY CHECKING #############################

  lower_singularity_threshold: {
    type: double,
    default_value: 17.0,
    description: "Start decelerating when the condition number hits this (close to singularity)",
    validation: {
      gt<>: 0.0
    }
  }

  hard_stop_singularity_threshold: {
    type: double,
    default_value: 30.0,
    description: "Stop when the condition number hits this",
    validation: {
      gt<>: 0.0
    }
  }

  leaving_singularity_threshold_multiplier: {
    type: double,
    default_value: 2.0,
    description: "When lower_singularity_threshold is triggered but moving away from singularity, move this many times faster",
    validation: {
      gt<>: 0.0
    }
  }

  singularity_step_scale: {
    type: double,
    default_value: 0.01,
    description: "The test vector towards singularity is scaled by this factor during singularity check",
    validation: {
      gt<>: 0.0
    }
  }
